name: ttofrozen-diffuser-yoon-sensitivity
services:
  run:
    container_name: turbulentto-frozen-diffuser-yoon-sensitivity
    build:
      context: .
      dockerfile: Dockerfile
    image: turbulentto-frozen-fenics:local
    platform: linux/amd64
    working_dir: /home/fenics/shared
    volumes:
      - ../../:/home/fenics/shared
    environment:
      HDF5_USE_FILE_LOCKING: "FALSE"
    command:
      - FluidTO/TurbulentTO_Frozen.py
      - --config
      - FluidTO/Configs_Frozen/Config_DiffuserYoon_Frozen_Sensitivity.py
