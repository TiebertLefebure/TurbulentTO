name: ttofrozen-doublepipe-borrvall
services:
  run:
    container_name: turbulentto-frozen-doublepipe-borrvall
    image: fenics/stable:py3
    platform: linux/amd64
    volumes:
      - ../../:/home/fenics/shared
    environment:
      HDF5_USE_FILE_LOCKING: "FALSE"
    entrypoint: ["/bin/bash", "-lc"]
    command: "cd /home/fenics/shared/FluidTO && exec python3 TurbulentTO_Frozen.py --config Configs_Frozen/Config_DoublePipeBorrvall_Frozen.py"
