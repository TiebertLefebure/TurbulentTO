# TurbulentTO — Configs_Frozen + TurbulentTO_Frozen.py
#
# Standaard (veilig): alleen de serial-batch — achter elkaar, één container.
#   docker compose -f docker-compose.frozen.yml up -d
#   docker compose -f docker-compose.frozen.yml logs -f frozen-all-serial
#
# Eén case apart:
#   docker compose --profile individual -f docker-compose.frozen.yml run --rm frozen-diffuser-yoon
#
# Stoppen batch-container:
#   docker compose -f docker-compose.frozen.yml down
#
# Parallel (alleen als je VM het aankan — expliciet meerdere services noemen):
#   docker compose --profile individual -f docker-compose.frozen.yml up -d frozen-diffuser-yoon frozen-pipebend-dilgen

x-frozen-common: &frozen-common
  image: fenics/stable:py3
  platform: linux/amd64
  working_dir: /home/fenics/shared/FluidTO
  volumes:
    - .:/home/fenics/shared
  environment:
    HDF5_USE_FILE_LOCKING: "FALSE"
  init: true

services:
  frozen-diffuser-yoon:
    <<: *frozen-common
    profiles: [individual]
    command:
      - python3
      - TurbulentTO_Frozen.py
      - --config
      - Configs_Frozen/Config_DiffuserYoon_Frozen.py

  frozen-doublepipe-borrvall:
    <<: *frozen-common
    profiles: [individual]
    command:
      - python3
      - TurbulentTO_Frozen.py
      - --config
      - Configs_Frozen/Config_DoublePipeBorrvall_Frozen.py

  frozen-doublepipe-yoon:
    <<: *frozen-common
    profiles: [individual]
    command:
      - python3
      - TurbulentTO_Frozen.py
      - --config
      - Configs_Frozen/Config_DoublePipeYoon_Frozen.py

  frozen-pipebend-alexandersen:
    <<: *frozen-common
    profiles: [individual]
    command:
      - python3
      - TurbulentTO_Frozen.py
      - --config
      - Configs_Frozen/Config_PipeBendAlexandersen_Frozen.py

  frozen-pipebend-dilgen:
    <<: *frozen-common
    profiles: [individual]
    command:
      - python3
      - TurbulentTO_Frozen.py
      - --config
      - Configs_Frozen/Config_PipeBendDilgen_Frozen.py

  frozen-ubend-alexandersen:
    <<: *frozen-common
    profiles: [individual]
    command:
      - python3
      - TurbulentTO_Frozen.py
      - --config
      - Configs_Frozen/Config_UBendAlexandersen_Frozen.py

  frozen-ubend-dilgen:
    <<: *frozen-common
    profiles: [individual]
    command:
      - python3
      - TurbulentTO_Frozen.py
      - --config
      - Configs_Frozen/Config_UBendDilgen_Frozen.py

  # Alle Configs_Frozen achter elkaar (script i.p.v. inline: geen Compose-$-interpolatie).
  frozen-all-serial:
    <<: *frozen-common
    command: ["bash", "/home/fenics/shared/scripts/run-all-frozen.sh"]
